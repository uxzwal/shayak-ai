<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sahayak AI - Offline Emergency Response Agent for India. First aid guidance for medical emergencies, works completely offline without internet." />
  <meta name="theme-color" content="#3b82f6" />
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🚑</text></svg>" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="./index.css" />
  
  <title>Sahayak AI - Emergency Response Agent</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Sahayak AI" />
  
  <!-- Preconnect for faster CDN loading -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com" />
  
  <style>
    /* Prevent layout shift */
    html {
      overflow-y: scroll;
    }
    
    /* Smooth scroll behavior */
    html {
      scroll-behavior: smooth;
    }
    
    /* Ensure minimum viewport height */
    body, #root {
      min-height: 100vh;
    }
    
    /* Loading state */
    #root:empty::after {
      content: '';
      display: block;
      min-height: 100vh;
      background: linear-gradient(to bottom, #f0f9ff, #ecfdf5);
    }
  </style>
</head>
<body class="bg-slate-50">
  <!-- Root element for React -->
  <div id="root"></div>

  <!-- React and ReactDOM from CDN for development/demo -->
  <!-- For production, use a build tool like Create React App or Vite -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Application Bundle -->
  <!-- In a real project, this would be built with a bundler (webpack, vite, etc.) -->
  <script type="module">
    /**
     * For development: import and run the App
     * For production: build with Create React App or similar
     */
    import App from './App.js';
    import React from 'react';
    import ReactDOM from 'react-dom/client';
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>

  <!-- Service Worker Registration for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js')
        .then(registration => {
          console.log('Service Worker registered:', registration);
        })
        .catch(error => {
          console.log('Service Worker registration failed:', error);
        });
    }
  </script>

  <!-- Analytics & Offline detection (optional) -->
  <script>
    // Detect online/offline status
    window.addEventListener('online', () => {
      console.log('App is online');
    });

    window.addEventListener('offline', () => {
      console.log('App is offline - all functionality remains available');
    });

    // Check on load
    if (!navigator.onLine) {
      console.log('App started in offline mode');
    }
  </script>
</body>
</html>
